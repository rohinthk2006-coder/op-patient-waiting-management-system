version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: op_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hospital_op_tracker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: op_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=hospital_op_tracker
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: op_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
